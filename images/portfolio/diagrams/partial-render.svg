<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 입력: 5개 design -->
  <text x="40" y="40" font-size="12.5" font-weight="700" fill="#64748b">5개 design 중 2개 mesh 손상</text>
  <g filter="url(#fShadow)"><rect x="40" y="56" width="150" height="232" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <g font-size="11" font-weight="600">
    <rect x="58" y="74" width="114" height="34" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/><text x="115" y="96" fill="#065f46" text-anchor="middle">design 1 ✓</text>
    <rect x="58" y="116" width="114" height="34" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/><text x="115" y="138" fill="#065f46" text-anchor="middle">design 2 ✓</text>
    <rect x="58" y="158" width="114" height="34" rx="7" fill="#fef2f2" stroke="#fecaca"/><text x="115" y="180" fill="#b91c1c" text-anchor="middle">design 3 ✕</text>
    <rect x="58" y="200" width="114" height="34" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/><text x="115" y="222" fill="#065f46" text-anchor="middle">design 4 ✓</text>
    <rect x="58" y="242" width="114" height="34" rx="7" fill="#fef2f2" stroke="#fecaca"/><text x="115" y="264" fill="#b91c1c" text-anchor="middle">design 5 ✕</text>
  </g>

  <!-- allSettled 분기 -->
  <line x1="190" y1="172" x2="244" y2="172" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#fShadow)"><rect x="248" y="138" width="190" height="68" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/></g>
  <text x="343" y="166" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">Promise.allSettled</text>
  <text x="343" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">per-group · per-file 2단계</text>

  <!-- 두 결과 -->
  <path d="M 438 158 C 470 158, 480 110, 512 110" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 438 186 C 470 186, 480 234, 512 234" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#fShadow)"><rect x="516" y="78" width="324" height="66" rx="12" fill="#ffffff" stroke="#a7f3d0"/></g>
  <circle cx="540" cy="104" r="5" fill="url(#gEmerald)"/>
  <text x="554" y="109" font-size="13" font-weight="700" fill="#1e293b">살아있는 mesh는 그대로 렌더</text>
  <text x="638" y="132" font-size="10.5" fill="#94a3b8" text-anchor="middle">사용자는 볼 수 있는 건 본다</text>

  <g filter="url(#fShadow)"><rect x="516" y="200" width="324" height="66" rx="12" fill="#ffffff" stroke="#fde68a"/></g>
  <circle cx="540" cy="226" r="5" fill="#f59e0b"/>
  <text x="554" y="231" font-size="13" font-weight="700" fill="#1e293b">누락 항목은 ModelTree에 warning</text>
  <text x="638" y="254" font-size="10.5" fill="#94a3b8" text-anchor="middle">"무엇이 빠졌는지"를 알려준다</text>

  <text x="440" y="318" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">전부 실패할 때만 throw → 에러 화면. 부분 실패는 화면 트리에 반영한다 (graceful degradation)</text>
  <text x="440" y="340" font-size="10.5" fill="#94a3b8" text-anchor="middle">"전부 못 본다" 대신 "어떤 게 빠졌는지 안다" — 에러를 어디까지 격리할지 FE가 설계</text>
</svg>
