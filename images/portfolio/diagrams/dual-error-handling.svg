<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 상단: Before -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#9a3412">Before — 모든 에러를 한 덩어리로</text>

  <g filter="url(#fShadow)"><rect x="40" y="50" width="140" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="110" y="82" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">에러 발생</text>

  <g filter="url(#fShadow)"><rect x="252" y="50" width="180" height="54" rx="12" fill="#fff7ed" stroke="#fed7aa"/></g>
  <text x="342" y="74" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">unknown 일괄 처리</text>
  <text x="342" y="92" font-size="10" fill="#c2410c" text-anchor="middle">예측 가능·불가능 구분 없음</text>

  <g filter="url(#fShadow)"><rect x="504" y="50" width="336" height="54" rx="12" fill="#fef2f2" stroke="#fecaca"/></g>
  <text x="672" y="74" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">전체 페이지 폴백 UI</text>
  <text x="672" y="92" font-size="10" fill="#dc2626" text-anchor="middle">케이스 리스트 실패 → SNB·대시보드까지 접근 불가</text>

  <line x1="180" y1="77" x2="248" y2="77" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="432" y1="77" x2="500" y2="77" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>

  <line x1="40" y1="130" x2="840" y2="130" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 하단: After -->
  <text x="40" y="166" font-size="13" font-weight="700" fill="#3730a3">After — 에러를 둘로 나눈다</text>

  <g filter="url(#fShadow)"><rect x="355" y="182" width="170" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="440" y="211" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">에러 발생</text>

  <!-- 왼쪽: 예측 불가능 -->
  <line x1="408" y1="230" x2="250" y2="262" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#fShadow)"><rect x="40" y="264" width="384" height="128" rx="12" fill="#eef2ff" stroke="#c7d2fe"/></g>
  <text x="60" y="290" font-size="12.5" font-weight="700" fill="#3730a3">예측 불가능 — 시스템·렌더 실패</text>
  <text x="60" y="314" font-size="10.5" fill="#4338ca">ErrorBoundary로 선언적 격리</text>
  <text x="60" y="333" font-size="10.5" fill="#475569">컴포넌트마다 흩어진 명령형 방어 코드 제거</text>
  <text x="60" y="354" font-size="10.5" fill="#475569">실패 허용 범위를 도메인 의존 관계로 구분</text>
  <text x="60" y="376" font-size="10.5" fill="#3730a3" font-weight="600">billing 실패해도 결제내역·구독취소·뒤로가기 생존</text>

  <!-- 오른쪽: 예측 가능 -->
  <line x1="472" y1="230" x2="630" y2="262" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#fShadow)"><rect x="456" y="264" width="384" height="128" rx="12" fill="#ecfeff" stroke="#a5f3fc"/></g>
  <text x="476" y="290" font-size="12.5" font-weight="700" fill="#0e7490">예측 가능 — 비즈니스 에러</text>
  <text x="476" y="314" font-size="10.5" fill="#0891b2">HTTP 200 · success:false · errorCode</text>
  <text x="476" y="333" font-size="10.5" fill="#475569">실패가 아니라 의도된 결과</text>
  <text x="476" y="354" font-size="10.5" fill="#475569">BusinessLogicError로 throw</text>
  <text x="476" y="376" font-size="10.5" fill="#0e7490" font-weight="600">에러 코드별로 분기하는 선언적 체인</text>
</svg>
