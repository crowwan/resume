<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="40" y="22" width="232" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="156" y="39" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">10분 주기 크론 · 동시 실행 방지</text>

  <g filter="url(#fShadow)"><rect x="40" y="76" width="146" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="62" cy="100" r="4.5" fill="#64748b"/>
  <text x="76" y="105" font-size="13" font-weight="700" fill="#1e293b">커밋 diff</text>
  <text x="113" y="130" font-size="10.5" fill="#94a3b8" text-anchor="middle">변경 발생</text>

  <g filter="url(#fShadow)"><rect x="204" y="76" width="146" height="88" rx="12" fill="#ffffff" stroke="#c7d2fe"/></g>
  <circle cx="226" cy="100" r="4.5" fill="url(#gIndigo)"/>
  <text x="240" y="105" font-size="13" font-weight="700" fill="#1e293b">Claude 분석</text>
  <text x="277" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">EC2 상주</text>
  <text x="277" y="147" font-size="10.5" fill="#94a3b8" text-anchor="middle">변경 영향 판단</text>

  <g filter="url(#fShadow)"><rect x="368" y="76" width="146" height="88" rx="12" fill="#ffffff" stroke="#c7d2fe"/></g>
  <circle cx="390" cy="100" r="4.5" fill="url(#gIndigo)"/>
  <text x="404" y="105" font-size="13" font-weight="700" fill="#1e293b">연관 TC 선별</text>
  <text x="441" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">QA팀이 관리하는</text>
  <text x="441" y="147" font-size="10.5" fill="#94a3b8" text-anchor="middle">qase 케이스 중에서</text>

  <g filter="url(#fShadow)"><rect x="532" y="76" width="146" height="88" rx="12" fill="#ffffff" stroke="#bae6fd"/></g>
  <circle cx="554" cy="100" r="4.5" fill="url(#gSky)"/>
  <text x="568" y="105" font-size="13" font-weight="700" fill="#1e293b">격리 환경 실행</text>
  <text x="605" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">재현 가능한 기반</text>
  <text x="605" y="147" font-size="10.5" fill="#94a3b8" text-anchor="middle">간섭 없는 실행</text>

  <g filter="url(#fShadow)"><rect x="696" y="76" width="146" height="88" rx="12" fill="#ffffff" stroke="#a7f3d0"/></g>
  <circle cx="718" cy="100" r="4.5" fill="url(#gEmerald)"/>
  <text x="732" y="105" font-size="13" font-weight="700" fill="#1e293b">Teams 보고</text>
  <text x="769" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">실제 회귀 vs</text>
  <text x="769" y="147" font-size="10.5" fill="#94a3b8" text-anchor="middle">테스트 코드 문제</text>

  <line x1="186" y1="120" x2="200" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="350" y1="120" x2="364" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="514" y1="120" x2="528" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="678" y1="120" x2="692" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="440" y="210" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">실패를 1차 분류해 사람이 확인할 것만 추린다 — AI를 "어떤 테스트가 필요한가"라는 판단 단계에 결합</text>
