<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigoP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gSkyP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gVioletP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 쌓는 순서 화살표 -->
  <line x1="56" y1="380" x2="56" y2="120" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrUp)"/>
  <text x="40" y="250" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 40 250)">쌓아 올린 순서</text>

  <!-- 바닥: 토대 -->
  <g filter="url(#fShadow)">
    <path d="M 100 380 l 110 -58 l 330 0 l -110 58 z" fill="url(#gIndigoP)" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="320" y="355" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">토대</text>
  <line x1="490" y1="351" x2="568" y2="351" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="576" y="347" font-size="13" font-weight="700" fill="#4338ca">도메인 통합(UrlHelper) + 런타임 분리(팀)</text>
  <text x="576" y="365" font-size="10.5" fill="#94a3b8">"격리하기 쉬운 환경"을 먼저 깐다</text>

  <!-- 중간: 격리 재현 -->
  <g filter="url(#fShadow)">
    <path d="M 100 282 l 110 -58 l 330 0 l -110 58 z" fill="url(#gSkyP)" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="240" y="262" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">격리 재현</text>
  <rect x="292" y="238" width="56" height="24" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="320" y="254" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">클라</text>
  <rect x="356" y="238" width="56" height="24" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="384" y="254" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">서버</text>
  <rect x="420" y="238" width="56" height="24" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="448" y="254" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">DB</text>
  <line x1="490" y1="253" x2="568" y2="253" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="576" y="249" font-size="13" font-weight="700" fill="#0369a1">커밋 단위 격리 재현 — Docker</text>
  <text x="576" y="267" font-size="10.5" fill="#94a3b8">그 시점의 클라이언트·서버·DB를 그대로, 결정론적으로</text>

  <!-- 위: AI 변경 감지 -->
  <g filter="url(#fShadow)">
    <path d="M 100 184 l 110 -58 l 330 0 l -110 58 z" fill="url(#gVioletP)" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="320" y="159" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">AI 변경 감지</text>
  <line x1="490" y1="155" x2="568" y2="155" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="576" y="151" font-size="13" font-weight="700" fill="#7c3aed">변경과 연관된 테스트만 선별 실행</text>
  <text x="576" y="169" font-size="10.5" fill="#94a3b8">격리 인프라를 실행 기반으로 사용</text>
</svg>
