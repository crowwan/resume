<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 상단: 썸네일 배치 로딩 -->
  <text x="40" y="40" font-size="13" font-weight="700" fill="#4338ca">① 썸네일 로딩 — 보이는 것만 로드, 모아서 한 번에 요청</text>

  <g filter="url(#fShadow)"><rect x="40" y="58" width="180" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="62" cy="82" r="4.5" fill="url(#gSky)"/>
  <text x="76" y="87" font-size="12.5" font-weight="700" fill="#1e293b">viewport 진입</text>
  <text x="130" y="110" font-size="10.5" fill="#94a3b8" text-anchor="middle">IntersectionObserver</text>

  <g filter="url(#fShadow)"><rect x="252" y="58" width="180" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="274" cy="82" r="4.5" fill="url(#gIndigo)"/>
  <text x="288" y="87" font-size="12.5" font-weight="700" fill="#1e293b">50ms 요청 병합</text>
  <text x="342" y="110" font-size="10.5" fill="#94a3b8" text-anchor="middle">모아서 1회 배치 요청</text>

  <g filter="url(#fShadow)"><rect x="464" y="58" width="180" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="486" cy="82" r="4.5" fill="url(#gIndigo)"/>
  <text x="500" y="87" font-size="12.5" font-weight="700" fill="#1e293b">URL 캐시(TTL)</text>
  <text x="554" y="110" font-size="10.5" fill="#94a3b8" text-anchor="middle">성공 4분 · 실패 10초</text>

  <g filter="url(#fShadow)"><rect x="676" y="58" width="164" height="74" rx="12" fill="#ffffff" stroke="#fde68a"/></g>
  <circle cx="698" cy="82" r="4.5" fill="#f59e0b"/>
  <text x="712" y="87" font-size="12.5" font-weight="700" fill="#1e293b">재요청 차단</text>
  <text x="758" y="110" font-size="10.5" fill="#94a3b8" text-anchor="middle">403·404 무한 재요청 방지</text>

  <line x1="220" y1="95" x2="248" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="432" y1="95" x2="460" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="644" y1="95" x2="672" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="40" y="160" font-size="10.5" fill="#64748b">성공해도 실패 횟수를 초기화하지 않음 — 같은 영구 오류가 무한 재요청을 다시 만들기 때문에 의도적으로 유지</text>

  <line x1="40" y1="186" x2="840" y2="186" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 하단: 증상 vs 구조 -->
  <text x="40" y="222" font-size="13" font-weight="700" fill="#4338ca">② 무한 재요청 — 재시도 제한이 아니라 캐시 구조 수정</text>

  <g filter="url(#fShadow)"><rect x="40" y="244" width="360" height="120" rx="12" fill="#fff7ed" stroke="#fed7aa"/></g>
  <text x="60" y="270" font-size="12.5" font-weight="700" fill="#9a3412">Before — 카드마다 훅 생성, 캐시 소실</text>
  <text x="60" y="294" font-size="10.5" fill="#7c2d12">카드 재마운트 시 훅이 새로 생겨 카드별 캐시</text>
  <text x="60" y="312" font-size="10.5" fill="#7c2d12">같은 썸네일 중복 요청, 실패 횟수도 초기화</text>
  <text x="60" y="330" font-size="10.5" fill="#7c2d12">403 같은 영구 오류도 새 URL로 재요청 반복</text>
  <text x="60" y="352" font-size="10.5" fill="#c2410c" font-weight="600">재시도 1회 제한으로 멈추지만 증상 억제에 그침</text>

  <line x1="408" y1="304" x2="448" y2="304" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#fShadow)"><rect x="456" y="244" width="384" height="120" rx="12" fill="#eef2ff" stroke="#c7d2fe"/></g>
  <text x="476" y="270" font-size="12.5" font-weight="700" fill="#3730a3">After — 캐시를 컴포넌트 바깥 공유 스코프로</text>
  <text x="476" y="294" font-size="10.5" fill="#4338ca">모든 카드가 하나의 캐시를 공유</text>
  <text x="476" y="312" font-size="10.5" fill="#475569">재마운트에도 캐시 적용, 중복 요청 없음</text>
  <text x="476" y="330" font-size="10.5" fill="#475569">성공(4분)뿐 아니라 실패(10초)도 캐시</text>
  <text x="476" y="352" font-size="10.5" fill="#3730a3" font-weight="600">재마운트 구조는 유지 — 공유 캐시로 우회하는 실용적 선택</text>
</svg>
