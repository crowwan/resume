<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- 실패 가능 영역 -->
  <g filter="url(#fShadow)">
    <rect x="60" y="120" width="200" height="92" rx="12" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  </g>
  <circle cx="84" cy="146" r="4.5" fill="#fb7185"/>
  <text x="98" y="151" font-size="14" font-weight="700" fill="#1e293b">결제 정보 조회</text>
  <text x="160" y="175" font-size="10.5" fill="#64748b" text-anchor="middle">일부 실패 가능</text>
  <text x="160" y="192" font-size="10.5" fill="#94a3b8" text-anchor="middle">HTTP 200 비즈니스 에러 포함</text>

  <!-- 실패해도 살아남는 것들 -->
  <path d="M 260 142 C 380 110, 440 68, 552 68" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrSoft)"/>
  <path d="M 260 160 C 380 152, 440 144, 552 144" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrSoft)"/>
  <path d="M 260 178 C 380 196, 440 218, 552 220" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrSoft)"/>
  <text x="400" y="124" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">실패해도 — 의존을 끊어 영향 없음</text>

  <g filter="url(#fShadow)"><rect x="556" y="40" width="264" height="56" rx="12" fill="#ffffff" stroke="#a7f3d0"/></g>
  <text x="580" y="73" font-size="13" font-weight="700" fill="#1e293b">결제 내역 조회</text>
  <circle cx="788" cy="68" r="10" fill="url(#gEmerald)"/>
  <path d="M 783 68 l 4 4 l 7 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#fShadow)"><rect x="556" y="116" width="264" height="56" rx="12" fill="#ffffff" stroke="#a7f3d0"/></g>
  <text x="580" y="149" font-size="13" font-weight="700" fill="#1e293b">구독 취소</text>
  <circle cx="788" cy="144" r="10" fill="url(#gEmerald)"/>
  <path d="M 783 144 l 4 4 l 7 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#fShadow)"><rect x="556" y="192" width="264" height="56" rx="12" fill="#ffffff" stroke="#a7f3d0"/></g>
  <text x="580" y="225" font-size="13" font-weight="700" fill="#1e293b">뒤로가기</text>
  <circle cx="788" cy="220" r="10" fill="url(#gEmerald)"/>
  <path d="M 783 220 l 4 4 l 7 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 의존하는 영역 -->
  <path d="M 260 196 C 400 230, 460 294, 552 294" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="400" y="262" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">여기에만 의존</text>

  <g filter="url(#fShadow)"><rect x="556" y="268" width="264" height="52" rx="12" fill="#fffbeb" stroke="#fde68a"/></g>
  <circle cx="580" cy="294" r="4.5" fill="#f59e0b"/>
  <text x="594" y="299" font-size="13" font-weight="700" fill="#78350f">결제 요약 UI — 이 영역만 degrade</text>
</svg>
