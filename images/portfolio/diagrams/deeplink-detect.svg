<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 실행 시도 카드 -->
  <g filter="url(#fShadow)">
    <rect x="40" y="130" width="190" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="64" cy="156" r="4.5" fill="url(#gIndigo)"/>
  <text x="78" y="161" font-size="14" font-weight="700" fill="#1e293b">앱 실행 시도</text>
  <text x="135" y="186" font-size="10.5" fill="#94a3b8" text-anchor="middle">웹 → deep link (Custom Protocol)</text>

  <!-- 자동 실행 경로 -->
  <path d="M 230 150 C 320 105, 470 92, 552 92" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="385" y="92" font-size="10.5" fill="#64748b" text-anchor="middle">설치돼 있으면 OS가 protocol 라우팅</text>

  <g filter="url(#fShadow)">
    <rect x="560" y="58" width="270" height="70" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
  </g>
  <circle cx="584" cy="84" r="4.5" fill="url(#gEmerald)"/>
  <text x="598" y="89" font-size="14" font-weight="700" fill="#1e293b">앱 실행 — 기존 흐름 그대로</text>
  <text x="695" y="112" font-size="10.5" fill="#94a3b8" text-anchor="middle">감지 결과와 무관하게 동작</text>

  <!-- 감지 pill (보조 신호) -->
  <rect x="300" y="170" width="204" height="58" rx="29" fill="#eef2ff" fill-opacity="0.7" stroke="#c7d2fe" stroke-dasharray="5 4"/>
  <text x="402" y="194" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">포커스 휴리스틱 감지</text>
  <text x="402" y="212" font-size="10.5" fill="#64748b" text-anchor="middle">3초 · 보조 신호 (오탐 가능)</text>

  <line x1="230" y1="186" x2="296" y2="197" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 안내 경로 -->
  <path d="M 504 199 C 530 199, 532 238, 556 238" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="222" font-size="10" fill="#64748b" text-anchor="middle">미감지 시</text>

  <g filter="url(#fShadow)">
    <rect x="560" y="200" width="270" height="86" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>
  <circle cx="584" cy="226" r="4.5" fill="url(#gIndigo)"/>
  <text x="598" y="231" font-size="14" font-weight="700" fill="#1e293b">설치 안내 — 항상 비차단</text>
  <text x="695" y="254" font-size="10.5" fill="#64748b" text-anchor="middle">다운로드가 언제나 가능</text>
  <text x="695" y="271" font-size="10.5" fill="#94a3b8" text-anchor="middle">오탐이어도 사용자는 막히지 않음</text>

  <!-- 2단계 badge -->
  <rect x="40" y="240" width="240" height="62" rx="12" fill="none" stroke="#ddd6fe" stroke-dasharray="6 5"/>
  <text x="160" y="266" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">2단계 (합의 · 착수 전)</text>
  <text x="160" y="284" font-size="10.5" fill="#94a3b8" text-anchor="middle">감지 제거 + 다운로드 상시 제공</text>

  <!-- key -->
  <text x="440" y="322" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">감지를 분기 조건으로 쓰지 않는다 — 실행과 다운로드 두 경로가 항상 열려 있다</text>
</svg>
