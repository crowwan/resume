<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gRedH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gIndigoH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="50" y="42" font-size="19" font-weight="700" fill="#0f172a">시각 회귀 검증 시간 (케이스당)</text>
  <rect x="672" y="22" width="158" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="751" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">약 -69%</text>

  <!-- Before: 고정 대기 120초 -->
  <text x="50" y="106" font-size="15" fill="#dc2626" font-weight="600">고정 대기</text>
  <rect x="50" y="118" width="640" height="40" rx="6" fill="url(#gRedH)" filter="url(#fShadow)"/>
  <text x="702" y="143" font-size="18" font-weight="700" fill="#dc2626">120초</text>

  <!-- After: 이벤트 기반 대기 37.7초 -->
  <text x="50" y="192" font-size="15" fill="#4338ca" font-weight="600">이벤트 기반 대기</text>
  <rect x="50" y="204" width="201" height="40" rx="6" fill="url(#gIndigoH)" filter="url(#fShadow)"/>
  <text x="267" y="229" font-size="18" font-weight="700" fill="#4338ca">37.7초</text>

  <text x="50" y="266" font-size="13" fill="#94a3b8">격리 컨테이너 baseline 고정 + 고정 대기를 이벤트 기반 대기로 전환</text>
</svg>
