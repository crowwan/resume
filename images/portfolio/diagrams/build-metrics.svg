<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <line x1="60" y1="320" x2="820" y2="320" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Group 1: 빌드 시간 -->
  <text x="240" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">빌드 시간</text>
  <rect x="150" y="130" width="90" height="190" rx="6" fill="url(#gRed)" filter="url(#fShadow)"/>
  <text x="195" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">33~39분</text>
  <text x="195" y="344" text-anchor="middle" font-size="15" fill="#94a3b8">Before</text>
  <rect x="290" y="203" width="90" height="117" rx="6" fill="url(#gIndigo)" filter="url(#fShadow)"/>
  <text x="335" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">17~24분</text>
  <text x="335" y="344" text-anchor="middle" font-size="15" fill="#4338ca" font-weight="600">After</text>
  <line x1="243" y1="156" x2="292" y2="205" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="212" y="70" width="96" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="260" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">약 -56%</text>

  <!-- Group 2: 업로드 아티팩트 -->
  <text x="640" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">업로드 아티팩트</text>
  <rect x="550" y="130" width="90" height="190" rx="6" fill="url(#gRed)" filter="url(#fShadow)"/>
  <text x="595" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">757MB</text>
  <text x="595" y="344" text-anchor="middle" font-size="15" fill="#94a3b8">Before</text>
  <rect x="690" y="236" width="90" height="84" rx="6" fill="url(#gIndigo)" filter="url(#fShadow)"/>
  <text x="735" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">334MB</text>
  <text x="735" y="344" text-anchor="middle" font-size="15" fill="#4338ca" font-weight="600">After</text>
  <line x1="643" y1="156" x2="692" y2="238" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="612" y="70" width="96" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="660" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">약 -56%</text>

  <text x="440" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">macOS 빌드 파이프라인 재설계</text>
</svg>
