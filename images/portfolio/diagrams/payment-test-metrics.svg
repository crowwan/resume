<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrBig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="440" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">결제 경로 테스트 실패 (격리 daily)</text>

  <!-- Before 카드 -->
  <rect x="90" y="96" width="240" height="120" rx="14" fill="#fef2f2" stroke="#fecaca" filter="url(#fShadow)"/>
  <text x="210" y="171" text-anchor="middle" font-size="58" font-weight="800" fill="#ef4444">약 28<tspan font-size="30">건</tspan></text>
  <text x="210" y="200" text-anchor="middle" font-size="15" fill="#b91c1c">Before · 만성 실패</text>

  <!-- 화살표 -->
  <line x1="350" y1="156" x2="540" y2="156" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrBig)"/>

  <!-- After 카드 -->
  <rect x="560" y="96" width="240" height="120" rx="14" fill="#eef2ff" stroke="#c7d2fe" filter="url(#fShadow)"/>
  <text x="672" y="171" text-anchor="middle" font-size="58" font-weight="800" fill="#4f46e5">0<tspan font-size="30">건</tspan></text>
  <circle cx="726" cy="138" r="15" fill="#4f46e5"/>
  <path d="M719,138 l5,5 l9,-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="200" text-anchor="middle" font-size="15" fill="#4338ca">After · 원인별 분리 진단</text>

  <text x="440" y="256" text-anchor="middle" font-size="13" fill="#94a3b8">만성 실패하던 결제(billtap) 경로를 원인별로 분리 진단해 근본 수정</text>
</svg>
