<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigoP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gVioletP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="290" y="34" width="380" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="54" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">모듈 한 번 배포 → 4개 서비스에 즉시 반영</text>

  <!-- 공통 모듈 레이어 (위) -->
  <g filter="url(#fShadow)">
    <path d="M 165 200 l 130 -70 l 430 0 l -130 70 z" fill="url(#gVioletP)" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <rect x="285" y="146" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="325" y="163" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">설정</text>
  <rect x="372" y="146" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="412" y="163" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">내보내기</text>
  <rect x="459" y="146" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="499" y="163" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">탐색기</text>
  <rect x="546" y="146" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="586" y="163" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">뷰어</text>

  <line x1="735" y1="165" x2="770" y2="165" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="778" y="161" font-size="13" font-weight="700" fill="#7c3aed">공통 모듈 레이어</text>
  <text x="778" y="179" font-size="10.5" fill="#94a3b8">한 번만 고치고 배포</text>

  <!-- 연결 (iframe 임베드) -->
  <line x1="325" y1="176" x2="325" y2="308" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="412" y1="176" x2="412" y2="308" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="499" y1="176" x2="499" y2="308" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="586" y1="176" x2="586" y2="308" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="296" y="248" font-size="10.5" fill="#94a3b8" text-anchor="end">same-origin iframe</text>
  <text x="296" y="264" font-size="10.5" fill="#94a3b8" text-anchor="end">+ postMessage</text>

  <!-- 서비스 레이어 (아래) -->
  <g filter="url(#fShadow)">
    <path d="M 165 360 l 130 -70 l 430 0 l -130 70 z" fill="url(#gIndigoP)" fill-opacity="0.92" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <rect x="285" y="306" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="325" y="323" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">cloud</text>
  <rect x="372" y="306" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="412" y="323" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">crown</text>
  <rect x="459" y="306" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="499" y="323" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">modeler</text>
  <rect x="546" y="306" width="80" height="26" rx="7" fill="#ffffff" fill-opacity="0.94"/>
  <text x="586" y="323" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">milling</text>

  <line x1="735" y1="325" x2="770" y2="325" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="778" y="321" font-size="13" font-weight="700" fill="#4338ca">4개 서비스</text>
  <text x="778" y="339" font-size="10.5" fill="#94a3b8">도메인·관리팀 분리</text>

  <text x="480" y="412" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">공통 기능 4개를 각 서비스에 복제·재배포하던 구조를 모듈 레이어 한 곳으로 통합</text>
</svg>
