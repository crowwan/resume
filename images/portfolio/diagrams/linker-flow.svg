<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 사용자 PC 영역 -->
  <rect x="330" y="34" width="520" height="186" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="352" y="60" font-size="12" font-weight="600" fill="#94a3b8">사용자 PC</text>

  <!-- 웹 브라우저 카드 -->
  <g filter="url(#fShadow)">
    <rect x="36" y="100" width="190" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="60" cy="124" r="4.5" fill="url(#gIndigo)"/>
  <text x="74" y="129" font-size="14" font-weight="700" fill="#1e293b">웹 브라우저</text>
  <text x="131" y="153" font-size="11.5" fill="#64748b" text-anchor="middle">Dentbird Cloud</text>
  <text x="131" y="172" font-size="10.5" fill="#94a3b8" text-anchor="middle">LNA 정책 — 로컬 접근 차단</text>

  <!-- Linker 카드 -->
  <g filter="url(#fShadow)">
    <rect x="368" y="100" width="200" height="92" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>
  <circle cx="392" cy="124" r="4.5" fill="url(#gIndigo)"/>
  <text x="406" y="129" font-size="14" font-weight="700" fill="#1e293b">Dentbird Linker</text>
  <text x="468" y="153" font-size="11.5" fill="#64748b" text-anchor="middle">Electron 앱</text>
  <text x="468" y="172" font-size="10.5" fill="#94a3b8" text-anchor="middle">변환·연동 단일 인터페이스</text>

  <!-- CAM 카드 -->
  <g filter="url(#fShadow)">
    <rect x="646" y="100" width="180" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="670" cy="124" r="4.5" fill="url(#gSky)"/>
  <text x="684" y="129" font-size="14" font-weight="700" fill="#1e293b">로컬 CAM</text>
  <text x="736" y="153" font-size="11.5" fill="#64748b" text-anchor="middle">외부 CAM 12종</text>
  <text x="736" y="172" font-size="10.5" fill="#94a3b8" text-anchor="middle">프로세스 8종 · 포트 4종</text>

  <!-- 서버 카드 -->
  <g filter="url(#fShadow)">
    <rect x="368" y="272" width="200" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <circle cx="392" cy="296" r="4.5" fill="#64748b"/>
  <text x="406" y="301" font-size="14" font-weight="700" fill="#1e293b">Dentbird 서버</text>
  <text x="468" y="324" font-size="10.5" fill="#94a3b8" text-anchor="middle">세션 기반 파일 제공</text>

  <!-- 웹 → Linker -->
  <line x1="226" y1="146" x2="362" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="295" y="118" font-size="11" font-weight="600" fill="#4338ca" text-anchor="middle">Custom Protocol</text>
  <text x="295" y="133" font-size="10.5" fill="#64748b" text-anchor="middle">+ 세션 정보</text>
  <text x="295" y="166" font-size="10" fill="#94a3b8" text-anchor="middle">HTTP가 아니라 LNA 비대상</text>

  <!-- Linker ↔ 서버 -->
  <line x1="446" y1="194" x2="446" y2="268" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="490" y1="268" x2="490" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="436" y="234" font-size="10.5" fill="#64748b" text-anchor="end">파일 요청</text>
  <text x="500" y="234" font-size="10.5" fill="#64748b">파일 전달</text>

  <!-- Linker → CAM -->
  <line x1="568" y1="146" x2="640" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="604" y="126" font-size="10.5" font-weight="600" fill="#0369a1" text-anchor="middle">변환 후 실행</text>
</svg>
