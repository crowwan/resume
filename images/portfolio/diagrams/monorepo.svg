<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 흩어진 레포들 -->
  <g transform="rotate(-3 110 96)" filter="url(#fShadow)">
    <rect x="40" y="74" width="140" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="110" y="100" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(-3 110 96)">클라이언트 앱 A</text>

  <g transform="rotate(2 125 156)" filter="url(#fShadow)">
    <rect x="55" y="134" width="140" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="125" y="160" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(2 125 156)">클라이언트 앱 B</text>

  <g transform="rotate(-2 115 216)" filter="url(#fShadow)">
    <rect x="40" y="194" width="150" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="115" y="220" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(-2 115 216)">공용 라이브러리 ×6</text>

  <text x="120" y="272" font-size="10.5" fill="#94a3b8" text-anchor="middle">레포마다 따로 — 공통 변경을 반복</text>
  <text x="120" y="290" font-size="10.5" fill="#94a3b8" text-anchor="middle">환경별 URL·i18n 스크립트 파편화</text>

  <!-- 이관 화살표 -->
  <line x1="230" y1="160" x2="330" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="140" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">Git Subtree 이관</text>
  <text x="280" y="184" font-size="10" fill="#94a3b8" text-anchor="middle">커밋 이력 보존 · 정기 동기화</text>

  <!-- NX 모노레포 -->
  <g filter="url(#fShadow)">
    <rect x="350" y="44" width="490" height="252" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>
  <circle cx="378" cy="76" r="4.5" fill="url(#gIndigo)"/>
  <text x="392" y="81" font-size="14.5" font-weight="800" fill="#1e293b">NX 모노레포</text>

  <rect x="378" y="100" width="150" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="453" y="126" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">클라이언트 앱 2종</text>

  <rect x="548" y="100" width="170" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="633" y="126" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">공용 라이브러리 6종</text>

  <line x1="453" y1="142" x2="453" y2="170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="633" y1="142" x2="633" y2="170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="378" y="174" width="434" height="48" rx="10" fill="url(#gIndigo)"/>
  <text x="595" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">도메인 통합 라이브러리</text>
  <text x="595" y="213" font-size="10.5" fill="#e0e7ff" text-anchor="middle">기준 도메인 하나에서 모든 URL 파생 — 런타임 분리·격리 재현의 토대</text>

  <rect x="378" y="234" width="434" height="40" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="595" y="259" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">i18n 단일 스크립트 — 중복 업로드 89줄 · 스크립트 14개 정리</text>
</svg>
