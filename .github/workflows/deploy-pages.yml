name: Deploy Resume to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'templates/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build HTML files
        run: |
          mkdir -p output
          pandoc resume.md \
            -o output/resume.html \
            --standalone \
            --section-divs \
            --css=resume-style.css \
            -V pagetitle="김진완 이력서 | Frontend Developer" \
            -V lang=ko
          pandoc portfolio.md \
            -o output/portfolio.html \
            --standalone \
            --section-divs \
            --css=portfolio-style.css \
            -A templates/mermaid.html \
            -V pagetitle="김진완 포트폴리오 | Frontend Developer" \
            -V lang=ko

      - name: Copy assets
        run: |
          cp templates/resume-style.css output/
          cp templates/portfolio-style.css output/
          cp templates/index.html output/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
